name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - name: Formatação (dotnet format)
        run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build

  agente-windows:
    # O WSL e o Linux não leem o Windows de verdade (WMI, log de eventos): aqui o .exe roda num Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publicar o .exe (autocontido, arquivo único)
        run: dotnet publish src/Triage.Agente -c Release -r win-x64 -o publicado
      - name: Rodar o .exe
        shell: pwsh
        run: |
          $saida = & .\publicado\triage.exe --versao
          if ($LASTEXITCODE -ne 0) { throw "triage --versao saiu com $LASTEXITCODE" }
          if ($saida -notmatch '^triage \d+\.\d+\.\d+') { throw "saída inesperada: $saida" }
          $saida
          & .\publicado\triage.exe comando-que-nao-existe 2>$null
          if ($LASTEXITCODE -ne 2) { throw "comando desconhecido deveria sair com 2, saiu com $LASTEXITCODE" }
          # A revisão de verdade num Windows (o runner é administrador: lê também o desgaste e C:\Windows\Temp)
          # O .exe escreve em UTF-8; sem isto o PowerShell lê com a página antiga e "Relatório" chega quebrado
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $revisao = & .\publicado\triage.exe revisar --sem-abrir
          if ($LASTEXITCODE -ne 0) { throw "triage revisar saiu com $LASTEXITCODE" }
          $revisao
          # Prova da P22: os componentes Razor renderizam dentro do .exe autocontido (arquivo único, sem trimming)
          $linha = $revisao | Where-Object { $_ -like 'Relatório completo: *' } | Select-Object -Last 1
          if (-not $linha) { throw "o revisar não mostrou o caminho do relatório" }
          $relatorio = $linha.Substring('Relatório completo: '.Length)
          if (-not (Test-Path $relatorio)) { throw "o relatório mostrado não existe: $relatorio" }
          $html = Get-Content $relatorio -Raw -Encoding utf8
          if ($html -notmatch 'Saúde dos discos' -or $html -notmatch 'id="item-firewall"') { throw "relatório sem os itens" }
          # Versão curta do HtmlSeguro dos testes, agora sobre o HTML que o .exe gerou de verdade
          if ($html -match '<\s*(script|svg|iframe|object|embed|form|img)|[a-z]+://|[\s/"'']on[a-z]+\s*=|(href|src|action)\s*=|<meta[^>]*refresh|url\s*\(') {
            throw "relatório com script, link ou endereço externo: $($Matches[0])"
          }
          Copy-Item $relatorio publicado\relatorio-ci.html
          & .\publicado\triage.exe gravar leitura-ci.json
          if ($LASTEXITCODE -ne 0) { throw "triage gravar saiu com $LASTEXITCODE" }
          Get-Content leitura-ci.json
          # Prova do caminho com admin: o runner é administrador, então estas partes têm que ter sido lidas
          $j = Get-Content leitura-ci.json | ConvertFrom-Json
          if (-not $j.administrador) { throw "o runner deveria ser administrador" }
          # Rede (Windows Update online, winget), histórico do Windows Update (o serviço pode estar desligado na imagem) e
          # antivírus (o Server pode não ter Defender) só aparecem no log por enquanto
          foreach ($parte in "volumes", "discos", "tempDoWindows", "cacheDoWindowsUpdate", "ultimaInicializacao",
                   "reinicioPendente", "inicializacao", "driversComErro", "eventos", "firewall") {
            if ($j.$parte.pulo) { throw "$parte ficou sem leitura mesmo com admin: $($j.$parte.pulo)" }
          }
          (Get-FileHash .\publicado\triage.exe -Algorithm SHA256).Hash.ToLower() + "  triage.exe" | Out-File -Encoding ascii publicado\triage.exe.sha256
          Get-Content publicado\triage.exe.sha256
          # O GitHub encerra o passo com o último $LASTEXITCODE: sem isto, tirar o gravar daria o 2 de propósito lá de cima
          exit 0
      - name: Correções e agendamento de verdade (o runner é descartável)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $exe = Resolve-Path .\publicado\triage.exe
          $registro = "$env:LOCALAPPDATA\Triage\correcoes.jsonl"
          function Ultima { (Get-Content $registro | Select-Object -Last 1 | ConvertFrom-Json) }
          function Velho0($pasta, $nome) {
            $arq = Join-Path $pasta $nome
            Set-Content $arq ("x" * 4096)
            (Get-Item $arq).LastWriteTime = (Get-Date).AddDays(-3)
            $arq
          }

          function Velho($pasta, $nome) {
            $arq = Velho0 $pasta $nome
            (Get-Item $arq).CreationTime = (Get-Date).AddDays(-3)
            $arq
          }

          # Contraprova: sem o "s", nada sai
          $lixo = Velho $env:TEMP "triage-ci-lixo.tmp"
          "n" | & $exe corrigir temporarios
          if (-not (Test-Path $lixo)) { throw "apagou sem confirmação" }
          if ((Ultima).decisao -ne "recusada") { throw "a recusa não foi registrada" }

          # Arquivo recém-extraído de um .zip: criado agora, mas com a data de modificação de anos atrás
          $doZip = Velho0 $env:TEMP "triage-ci-do-zip.dll"
          # Contraprova da junção: uma junção no Temp apontando para fora, com um arquivo velho do outro lado
          $fora = New-Item -ItemType Directory "$env:RUNNER_TEMP\triage-fora" -Force
          $deFora = Velho $fora.FullName "importante.docx"
          $null = New-Item -ItemType Junction -Path "$env:TEMP\triage-ci-juncao" -Target $fora.FullName

          # Temporários (usuário e Windows: o runner é admin)
          $doWindows = Velho "$env:WINDIR\Temp" "triage-ci-lixo.tmp"
          "s" | & $exe corrigir temporarios
          if ($LASTEXITCODE -ne 0) { throw "corrigir temporarios saiu com $LASTEXITCODE" }
          if ((Test-Path $lixo) -or (Test-Path $doWindows)) { throw "os temporários antigos ficaram" }
          if (-not (Test-Path $doZip)) { throw "apagou um arquivo criado agora (só a modificação era antiga)" }
          if (-not (Test-Path $deFora)) { throw "seguiu a junção e apagou um arquivo fora do Temp" }
          if ((Ultima).decisao -ne "aplicada") { throw "a limpeza não foi registrada" }

          # Lixeira: manda um arquivo para lá e esvazia pelo SHEmptyRecycleBin
          Add-Type -AssemblyName Microsoft.VisualBasic
          $paraLixeira = Velho $env:TEMP "triage-ci-lixeira.txt"
          [Microsoft.VisualBasic.FileIO.FileSystem]::DeleteFile($paraLixeira, 'OnlyErrorDialogs', 'SendToRecycleBin')
          "s" | & $exe corrigir lixeira
          if ($LASTEXITCODE -ne 0) { throw "corrigir lixeira saiu com $LASTEXITCODE" }
          if ((Ultima).decisao -ne "aplicada" -or (Ultima).apagados -lt 1) { throw "a lixeira não foi esvaziada: $(Ultima)" }

          # Cache do Windows Update: para o serviço, limpa e devolve o serviço como estava
          # Começa com o serviço ligado, para provar também o religar
          Start-Service wuauserv
          $antes = (Get-Service wuauserv).Status
          "wuauserv antes: $antes"
          $cab = Velho "$env:WINDIR\SoftwareDistribution\Download" "triage-ci-lixo.tmp"
          "s" | & $exe corrigir cache-windows-update
          if ($LASTEXITCODE -ne 0) { throw "corrigir cache-windows-update saiu com $LASTEXITCODE" }
          if (Test-Path $cab) { throw "o cache antigo ficou" }
          if ((Ultima).decisao -ne "aplicada" -or (Ultima).apagados -lt 1) { throw "o cache não foi registrado: $(Ultima)" }
          $depois = (Get-Service wuauserv).Status
          "wuauserv depois: $depois"
          if ($antes -eq 'Running' -and $depois -ne 'Running') { throw "o Windows Update ficou parado" }
          Get-Content $registro

          # Agendamento pelo schtasks, com o XML que os testes conferem
          & $exe agendar
          if ($LASTEXITCODE -ne 0) { throw "agendar saiu com $LASTEXITCODE" }
          $xml = schtasks /Query /TN "\Triage\Revisao semanal" /XML | Out-String
          if ($xml -notmatch 'revisar --sem-abrir' -or $xml -notmatch '<StartWhenAvailable>true') { throw "tarefa diferente do esperado: $xml" }
          & $exe desagendar
          schtasks /Query /TN "\Triage\Revisao semanal" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "a tarefa continuou depois do desagendar" }
          exit 0
      - uses: actions/upload-artifact@v5
        with:
          name: triage-win-x64
          path: |
            publicado/triage.exe*
            publicado/relatorio-ci.html
